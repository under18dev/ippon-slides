# push / PR で型チェックとテストを走らせる
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # テストは .ts を型ストリップで直接実行するので Node 22.18+ が要る
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # PDF のテストは Chrome が無い環境では自動でスキップされる
      - run: npm test

  # サイト（site/、Astro）がビルドできるか。docs/ を読むので、ドキュメントのリンク切れなどもここで止まる
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - run: npm ci && npm run build
      - run: npm ci && npm run build
        working-directory: site
