# site/（Astro + Starlight）をビルドして GitHub Pages に公開する（LP 兼 docs）
# ドキュメントの中身はリポジトリの docs/ と docs/en/ を読むので、それらの変更でも公開し直す
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'src/**'
      - 'assets/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時に 1 デプロイだけ。進行中のものはキャンセルしない（公開を落とさない）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'under18dev/ippon-slides'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      # トップのデモは、このリポジトリの ippon で実際にビルドする（assets/deck.js が要る）
      - run: npm ci && npm run build
      - run: npm ci && npm run build
        working-directory: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - id: deploy
        uses: actions/deploy-pages@v4
